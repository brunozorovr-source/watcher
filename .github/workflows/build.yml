   name: build
   on: [push, workflow_dispatch]
   jobs:
     build:
       runs-on: ubuntu-22.04
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: 8
         - run: chmod +x gradlew
         - run: ./gradlew setupCiWorkspace
         - run: ./gradlew build
         - uses: actions/upload-artifact@v4
           with:
             name: mod
             path: build/libs/*.jar
